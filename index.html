<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoger of Lager!</title>
    <style>
           body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        text-align: center; 
        background: linear-gradient(135deg, #1e1e2f, #11111e); 
        color: white; 
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        box-sizing: border-box;
    }
    h1 { font-size: 28px; margin-bottom: 5px; color: #ffdd57; }
    p { font-size: 14px; color: #aaa; margin-top: 0; }
    
    .card-container {
        background: rgba(255, 255, 255, 0.05);
        padding: 30px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        width: 100%;
        max-width: 320px;
    }

    .kaart { 
        font-size: 90px; 
        font-weight: bold;
        margin: 20px auto; 
        background: white; 
        color: #222; 
        width: 120px;
        height: 170px;
        line-height: 170px;
        border-radius: 15px; 
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    
    .btn-container { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
    
    button { 
        flex: 1;
        font-size: 18px; 
        font-weight: bold;
        padding: 15px; 
        cursor: pointer; 
        border-radius: 12px; 
        border: none; 
        transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }
    .hoger { background: #4CD964; color: white; }
    .lager { background: #FF3B30; color: white; }
    
    #boodschap { font-size: 16px; margin: 20px 0 10px 0; min-height: 40px; }
    .score-box { font-size: 18px; color: #ffdd57; font-weight: bold; }

    </style>
</head>
<body>

    <div class="card-container">
        <h1>Hoger of Lager 🃏</h1>
        <p>Raden maar! Wat is de volgende kaart?</p>
        
        <div class="kaart" id="kaart-scherm">5</div>

        <div class="btn-container">
            <button class="hoger" onclick="speel('hoger')">Hoger ▲</button>
            <button class="lager" onclick="speel('lager')">Lager ▼</button>
        </div>

        <h3 id="boodschap">Klik op een knop om te beginnen!</h3>
        <p class="score-box">Score: <span id="score-scherm">0</span></p>
    </div>

    <script>

        // We beginnen met een startgetal (bijvoorbeeld 5) en een score van 0
        let huidigGetal = 5;
        let score = 0;

        function speel(keuze) {
            // 1. Genereer een nieuw willekeurig getal tussen de 1 en 10
            let nieuwGetal = Math.floor(Math.random() * 10) + 1;
            
            // Zorg ervoor dat het nieuwe getal niet exact hetzelfde is, dat is saai
            while (nieuwGetal === huidigGetal) {
                nieuwGetal = Math.floor(Math.random() * 10) + 1;
            }

            // 2. Laat het nieuwe getal zien op het witte kaartje
            document.getElementById("kaart-scherm").innerText = nieuwGetal;

            // 3. Controleren of de speler gelijk heeft
            let goedGeraden = false;

            if (keuze === 'hoger' && nieuwGetal > huidigGetal) {
                goedGeraden = true;
            } else if (keuze === 'lager' && nieuwGetal < huidigGetal) {
                goedGeraden = true;
            }

            // 4. De score updaten en een berichtje tonen
            if (goedGeraden) {
                score = score + 1;
                document.getElementById("boodschap").innerText = "✅ Lekker bezig! Het was inderdaad " + (keuze === 'hoger' ? 'hoger' : 'lager') + " (" + nieuwGetal + ").";
                document.getElementById("boodschap").style.color = "#4CAF50"; // Groene tekst
            } else {
                score = 0; // Score reset naar 0 bij een fout
                document.getElementById("boodschap").innerText = "❌ Helaas! Het getal was " + nieuwGetal + ". Je begint weer op 0!";
                document.getElementById("boodschap").style.color = "#f44336"; // Rode tekst
            }

            // Toon de nieuwe score op het scherm
            document.getElementById("score-scherm").innerText = score;

            // Onthoud het nieuwe getal voor de volgende ronde
            huidigGetal = nieuwGetal;
        }
    </script>


</body>
</html>
